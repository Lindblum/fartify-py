<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fartify 💨</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💨</text></svg>" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Fartify <span class="emoji">💨</span></h1>
      <p class="tagline">Upload a song, select a layer, and we'll turn it into farts.</p>
    </header>

    <section id="upload-card" class="card">
      <form id="upload-form" novalidate>
        <label id="dropzone" for="file-input">
          <span id="dropzone-text">Drop an audio file here, or click to choose one</span>
          <span class="hint">MP3, WAV, M4A, FLAC, OGG</span>
        </label>
        <input id="file-input" type="file" name="file" accept=".mp3,.wav,.m4a,.flac,.ogg,.aac" hidden />

        <div class="options">
          <input type="hidden" id="algorithm" value="{{ default_algorithm }}" data-labels="{{ algorithm_labels | tojson | forceescape }}" />
          <label class="field">
            <span class="field-label">Layer to Fartify</span>
            <select id="layer" name="layer">
              {% for l in layers %}
              <option value="{{ l.value }}">{{ l.label }}</option>
              {% endfor %}
            </select>
          </label>

          <details id="calibration" class="calibration">
            <summary>Calibration</summary>
            {% for group in setting_groups %}
            <fieldset class="field-group"{% if group.algorithms %} data-algorithms="{{ group.algorithms | join(' ') }}"{% endif %}>
              <legend>{{ group.title }}</legend>
              <div class="field-grid">
                {% for f in group.fields %}
                {% if f.kind == "checkbox" %}
                <label class="field checkbox-field" title="{{ f.help }}">
                  <span class="checkbox-row">
                    <input type="checkbox" name="{{ f.name }}" data-setting data-label="{{ f.label }}"{% if f.default %} checked{% endif %} />
                    <span class="field-label">{{ f.label }}</span>
                  </span>
                </label>
                {% else %}
                <label class="field" title="{{ f.help }}">
                  <span class="field-label">{{ f.label }}</span>
                  <input type="number" name="{{ f.name }}" data-setting data-label="{{ f.label }}" value="{{ f.default }}" min="{{ f.min }}" max="{{ f.max }}" step="{{ f.step }}" required />
                </label>
                {% endif %}
                {% endfor %}
              </div>
            </fieldset>
            {% endfor %}
            <button type="button" id="reset-settings" class="link-button">Reset to defaults</button>
          </details>
        </div>

        <button id="submit-btn" type="submit" disabled>Fartify!</button>
      </form>
    </section>

    <section id="jobs" class="jobs"></section>
  </main>

  <footer class="site-footer">
    <p class="sample-count"><a href="{{ url_for('samples_page') }}">{{ sample_count }} fart samples in library</a></p>
  </footer>

  <template id="job-card-template">
    <div class="job-card card">
      <div class="job-header">
        <span class="job-filename"></span>
        <span class="job-status"></span>
      </div>
      <div class="job-progress">
        <div class="progress-bar"><div class="progress-fill"></div></div>
        <p class="progress-stage"></p>
      </div>
      <details class="job-details hidden">
        <summary>Details</summary>
        <div class="result-meta"></div>
        <div class="result-spectrograms hidden">
          <a class="spectrogram-link layer-spectrogram" target="_blank" rel="noopener" title="Open full size">
            <span class="hint">Layer spectrogram</span>
            <span class="spectrogram-frame">
              <img class="spectrogram" loading="lazy" alt="Spectrogram of the isolated layer" />
              <span class="playhead hidden"></span>
            </span>
          </a>
          <a class="spectrogram-link approx-spectrogram" target="_blank" rel="noopener" title="Open full size">
            <span class="hint">Rebuilt from samples</span>
            <span class="spectrogram-frame">
              <img class="spectrogram" loading="lazy" alt="Spectrogram rebuilt from sample spectrograms" />
              <span class="playhead hidden"></span>
            </span>
          </a>
        </div>
        <pre class="error-log hidden"></pre>
      </details>
      <div class="job-result hidden">
        <audio class="player" controls></audio>
      </div>
      <div class="job-actions">
        <a class="button download-audio hidden" download title="Download audio (WAV)"><svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> WAV</a>
        <a class="button secondary download-midi hidden" download title="Download melody (MIDI)"><svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> MIDI</a>
        <button type="button" class="icon-button delete-job" title="Delete job" aria-label="Delete job"><svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M9.5 10v7.5"/><path d="M14.5 10v7.5"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
      </div>
    </div>
  </template>

  <div id="confirm-overlay" class="modal-overlay hidden">
    <div class="modal-panel card">
      <p id="confirm-message"></p>
      <div class="modal-actions">
        <button type="button" id="confirm-no" class="button secondary">Cancel</button>
        <button type="button" id="confirm-yes" class="button danger">Delete</button>
      </div>
    </div>
  </div>

  <script>
    window.FARTIFY_SAMPLES = {{ sample_files | tojson }};
  </script>
  <script src="{{ url_for('static', filename='playhead.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
